name: Validate JavaScript
# Validate server and browser scripts before merging
on:
  push:
    branches:
      - main
      - feature/chat-agenda-recetas
      - fix/empleados-password-admin
      - feature/consultation-billing-handoff
  pull_request:
    branches:
      - main
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check js/db.js
          node --check js/app.js
