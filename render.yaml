services:
  - type: web
    name: consultorio-medico-cc
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: consultorio-medico-cc-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COBROS_NIP
        sync: false
      - key: BALANCE_NIP
        sync: false
      - key: SESSION_SECRET
        generateValue: true
databases:
  - name: consultorio-medico-cc-db
    plan: basic-256mb
    databaseName: consultorio_cc
    user: consultorio_cc_user
